[versions]
agp                    = "9.2.1"
detekt                 = "1.23.8"
vanniktech-publish     = "0.37.0"
core-ktx               = "1.19.0"
annotation             = "1.10.0"
work                   = "2.11.2"
security-crypto        = "1.1.0"
lifecycle              = "2.10.0"
material               = "1.14.0"
coil                   = "2.7.0"
junit4                 = "4.13.2"
assertj                = "3.27.7"
# For instrumented tests only: 3.x touches java.time in a static initializer, which does not
# exist on API 24 without desugaring, and desugaring a library is a requirement on every consumer.
assertj-android        = "2.9.1"
org-json               = "20260522"
androidx-test-ext      = "1.3.0"
androidx-test-core     = "1.7.0"
espresso               = "3.7.0"
kotlinx-coroutines     = "1.11.0"
mockk                  = "1.14.11"
bcv                    = "0.18.1"
kover                  = "0.9.8"
dokka                  = "2.2.0"

[libraries]
androidx-core-ktx              = { module = "androidx.core:core-ktx",                          version.ref = "core-ktx" }
androidx-annotation            = { module = "androidx.annotation:annotation",                   version.ref = "annotation" }
androidx-work-runtime          = { module = "androidx.work:work-runtime-ktx",                   version.ref = "work" }
androidx-security-crypto       = { module = "androidx.security:security-crypto",                version.ref = "security-crypto" }
androidx-lifecycle-runtime     = { module = "androidx.lifecycle:lifecycle-runtime-ktx",         version.ref = "lifecycle" }
material                       = { module = "com.google.android.material:material",              version.ref = "material" }
coil                           = { module = "io.coil-kt:coil",                                  version.ref = "coil" }
junit4                         = { module = "junit:junit",                                       version.ref = "junit4" }
assertj-core                   = { module = "org.assertj:assertj-core",                          version.ref = "assertj" }
assertj-core-android           = { module = "org.assertj:assertj-core",                          version.ref = "assertj-android" }
org-json                       = { module = "org.json:json",                                     version.ref = "org-json" }
androidx-test-ext-junit        = { module = "androidx.test.ext:junit",                          version.ref = "androidx-test-ext" }
androidx-test-core             = { module = "androidx.test:core",                               version.ref = "androidx-test-core" }
androidx-test-espresso-core    = { module = "androidx.test.espresso:espresso-core",             version.ref = "espresso" }
androidx-work-testing          = { module = "androidx.work:work-testing",                        version.ref = "work" }
kotlinx-coroutines-core        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "kotlinx-coroutines" }
mockk                          = { module = "io.mockk:mockk",                                   version.ref = "mockk" }

[plugins]
android-application    = { id = "com.android.application",             version.ref = "agp" }
android-library        = { id = "com.android.library",                 version.ref = "agp" }
detekt                 = { id = "io.gitlab.arturbosch.detekt",         version.ref = "detekt" }
vanniktech-publish     = { id = "com.vanniktech.maven.publish",        version.ref = "vanniktech-publish" }
bcv                    = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
kover                  = { id = "org.jetbrains.kotlinx.kover",                          version.ref = "kover" }
dokka                  = { id = "org.jetbrains.dokka",                                  version.ref = "dokka" }
