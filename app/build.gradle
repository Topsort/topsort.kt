import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import io.gitlab.arturbosch.detekt.Detekt

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.detekt)
}

def properties = { k -> "\"${project.properties.get(k)}\"" }

android {
    namespace 'com.topsort.example'
    compileSdk 36

    defaultConfig {
        applicationId "com.topsort.example"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName VERSION_NAME

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'TOKEN', properties("topsort.sample.bearertoken")
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            buildConfigField 'String', 'TOKEN', properties("topsort.sample.bearertoken")
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig = true
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}

tasks.withType(Detekt).configureEach {
    config = files(["$projectDir/../detekt.yaml"])
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime
    implementation libs.material
    implementation project(':TopsortAnalytics')

    // Declared on the main classpath, not just androidTest, so the two agree on a version.
    // AGP resolves androidTest consistently with runtime: whatever debugRuntimeClasspath picks
    // becomes a `strictly` constraint on debugAndroidTestRuntimeClasspath. Without this, main
    // inherited coroutines 1.9.0 transitively from androidx.lifecycle while androidTest asked
    // the catalog for 1.10.2, and the two could not be reconciled - the androidTest classpath
    // failed to resolve at all, so :app's instrumented tests could not even be compiled.
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    testImplementation libs.junit4

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.kotlinx.coroutines.core
    androidTestImplementation libs.kotlinx.coroutines.android
}
