name: Release

on:
  release:
    types: [published]

  # Manual fallback. The release trigger above does not fire for releases created by
  # release-please, because it authors them with the default GITHUB_TOKEN and GitHub
  # suppresses workflow triggers from that token to prevent recursive runs. Every release
  # so far has therefore tagged without publishing - v2.0.1 is tagged and absent from
  # Maven Central. Until release-please is given a PAT, this is how a release ships.
  #
  # `ref` should be the release tag, e.g. v3.0.0 - NOT a branch.
  #
  # Whatever ref is given here is what gets built, signed and uploaded, and the version it
  # publishes under is VERSION_NAME in gradle.properties at that ref. Nothing downstream checks
  # that the ref corresponds to a tag or to a release, so passing a branch publishes whatever
  # happens to be on it at that moment, under whatever version that commit declares. Maven
  # Central uploads cannot be withdrawn, so an accidental branch publish is permanent.
  #
  # 3.0.0 was published from `main` as a one-off: the v3.0.0 tag predated the fix in #166 that
  # made the source jar buildable, so the tag itself could not be published. main and the tag
  # were otherwise identical. Do not treat that as the pattern - pass the tag.
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish, e.g. v3.0.0. Pass a tag, not a branch - see the note above the trigger."
        required: true
        type: string

permissions:
  contents: read

jobs:
  publishToMaven:
    environment:
      name: "MavenCentral"

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Fail before anything is built, signed or uploaded. Maven Central uploads cannot be
      # withdrawn, so the cheap checks run first.
      - name: Verify the dispatch ref is a tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/$REF" >/dev/null 2>&1; then
            echo "::error::'$REF' is not a tag in this repository."
            echo "::error::Publishing a branch ships whatever is on it at that moment, under"
            echo "::error::whatever version that commit declares, and the upload is permanent."
            echo "::error::Tag the commit you mean to release, then dispatch with that tag."
            exit 1
          fi
          echo "'$REF' is a tag."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # On a manual run, publish exactly the tag that was asked for rather than whatever
          # the dispatch ref happens to be: workflow_dispatch reads the workflow definition
          # from the selected ref, so it has to be dispatched from a branch that has this
          # trigger, while the artifact must come from the tag.
          ref: ${{ inputs.ref || github.ref }}

      # The version actually published comes from gradle.properties at the checked-out ref, not
      # from the tag name, and the two can disagree. Before #162 release-please tagged a new
      # version without updating VERSION_NAME, so a v2.0.1 publish would have shipped as 2.0.0.
      # Checked on both trigger paths, because that failure was silent and went unnoticed for
      # five months.
      - name: Verify VERSION_NAME matches the tag
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          declared=$(grep '^VERSION_NAME=' gradle.properties | cut -d '=' -f2- | tr -d '[:space:]')
          expected="${TAG#v}"
          if [ "$declared" != "$expected" ]; then
            echo "::error::Tag $TAG would publish as $declared."
            echo "::error::gradle.properties at this ref declares VERSION_NAME=$declared but the"
            echo "::error::tag says $expected. Publishing would put the wrong version on Maven"
            echo "::error::Central permanently. Fix VERSION_NAME at this ref, or dispatch a tag"
            echo "::error::whose VERSION_NAME already matches."
            exit 1
          fi
          echo "Publishing $declared from $TAG."

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4

      - name: Build library
        run: ./gradlew :TopsortAnalytics:compileReleaseKotlin

      - name: Upload library
        run: ./gradlew :TopsortAnalytics:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
