name: Dependency review

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      # Waits for the PR's graph to be submitted by "Dependency submission" before comparing.
      # Deprecated SPDX ids on purpose: they match both the -only and -or-later forms.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 900
