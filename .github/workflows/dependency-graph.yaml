name: Dependency graph

# Every dependency of this library is transitive to every marketplace app, so a new one is
# reviewed at the PR. This job only uploads the graph; "Dependency submission" submits it with
# the repository's token (a PR token cannot, and dependabot and fork PRs have none). Pushes to
# main take the same path, so there is one code path and no write permission here.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/dependency-submission@67621b124fd2e251c5e8a0e6e3b91318f2287669  # v6.3.0
        with:
          dependency-graph: generate-and-upload
          cache-provider: basic
          # Only what consumers receive. Without this every plugin, test and sample-app
          # dependency is submitted as a runtime dependency and gates PRs.
          dependency-graph-include-projects: ':TopsortAnalytics'
          dependency-graph-include-configurations: 'releaseRuntimeClasspath'
