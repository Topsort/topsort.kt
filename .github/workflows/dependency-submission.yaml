name: Dependency submission

# Submits the graph a "Dependency graph" run uploaded, with this repository's token - which is
# what lets dependabot and fork PRs be reviewed. Never checks out or runs untrusted code.
on:
  workflow_run:
    workflows: [Dependency graph]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  submit:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          dependency-graph: download-and-submit
