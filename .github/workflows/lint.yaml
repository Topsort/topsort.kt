name: Lints

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4

      - name: Run detekt
        run: ./gradlew detekt

      - name: Check binary compatibility
        run: ./gradlew :TopsortAnalytics:apiCheck

      # The Java sample is the only Java consumer of the SDK we control, which makes it the
      # canary for Java interop: Kotlin default arguments generate no Java overloads, so every
      # optional parameter added to a report* method is a source break for Java callers. Nothing
      # built this file until now, so it broke silently in 3.0.0 and stayed broken across two
      # releases. compileDebugKotlin does not cover it - Java is a separate compilation task.
      - name: Compile the Java sample
        run: ./gradlew :app:compileDebugJavaWithJavac
