name: Lints

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4

      - name: Run detekt
        run: ./gradlew detekt

      - name: Check binary compatibility
        run: ./gradlew :TopsortAnalytics:apiCheck

      # Builds the sample app and its instrumented tests. Nothing did until recently, and three
      # separate things rotted in there unnoticed: the Java sample stopped compiling in 3.0.0
      # (Kotlin default arguments generate no Java overloads, so every optional parameter added
      # to a report* method is a source break for Java callers), and the androidTest source set
      # stopped resolving its dependencies, which took the banner tests with it.
      #
      # assembleDebugAndroidTest is the cheap guard that covers all of it: main Kotlin, main
      # Java, androidTest compilation, and dependency resolution for both classpaths. The tests
      # themselves run in the Tests workflow.
      - name: Build the sample app and its instrumented tests
        run: ./gradlew :app:assembleDebugAndroidTest
