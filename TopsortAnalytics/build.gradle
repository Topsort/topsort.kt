import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import io.gitlab.arturbosch.detekt.Detekt
import org.jetbrains.dokka.gradle.engine.parameters.VisibilityModifier
import kotlinx.validation.KotlinApiBuildTask
import kotlinx.validation.KotlinApiCompareTask

plugins {
    id 'jacoco'
    alias(libs.plugins.android.library)
    alias(libs.plugins.detekt)
    alias(libs.plugins.vanniktech.publish)
    alias(libs.plugins.bcv)
    alias(libs.plugins.kover)
    alias(libs.plugins.dokka)
}

// The User-Agent must report the version we actually publish. Generating it from VERSION_NAME
// keeps them from drifting; the hand-maintained constant had been stuck at 1.0 across every
// release. Generated rather than exposed through BuildConfig so it stays internal and out of the
// published ABI.
def libraryVersionSrcDir = layout.buildDirectory.dir("generated/libraryVersion")

def generateLibraryVersion = tasks.register("generateLibraryVersion") {
    def outputDir = libraryVersionSrcDir
    def libraryVersion = VERSION_NAME
    inputs.property("libraryVersion", libraryVersion)
    outputs.dir(outputDir)
    doLast {
        def packageDir = new File(outputDir.get().asFile, "com/topsort/analytics/core")
        packageDir.mkdirs()
        new File(packageDir, "LibraryVersion.kt").text =
            "// Generated from VERSION_NAME in gradle.properties. Do not edit.\n" +
            "package com.topsort.analytics.core\n" +
            "\n" +
            "internal const val LIBRARY_VERSION: String = \"" + libraryVersion + "\"\n"
    }
}

// Everything that reads the generated source has to wait for it, and the two mechanisms below
// cover different consumers - verified by clean build, since dropping either one fails a different
// task. The builtBy on the source set (see android.sourceSets, below) reaches consumers that
// resolve the source set as a FileCollection, but not these two:
//
//  - Kotlin compilation reads the srcDir through AGP's variant wiring.
//  - The publish plugin's source-jar tasks are validated by Gradle against the producing task
//    directly, and builtBy on the source set does not satisfy that check.
//
// This is why the failure only ever appeared during publish: ordinary builds never run a source
// jar, so the missing dependency sat undetected from the day the generator was added.
// Matched by name: under AGP 9's built-in Kotlin the compile task is not KGP's KotlinCompile class.
tasks.matching { it.name ==~ /compile(Release|Debug)(UnitTest|AndroidTest)?Kotlin/ }.configureEach {
    dependsOn(generateLibraryVersion)
}

tasks.matching { it.name ==~ /source(Release|Debug)Jar|extract(Release|Debug)Annotations/ }.configureEach {
    dependsOn(generateLibraryVersion)
}

android {
    namespace 'com.topsort.analytics'

    sourceSets {
        main {
            // builtBy, not a bare path. A bare path carries no producer, so only consumers wired
            // by hand waited for the generator - which is how sourceReleaseJar came to read this
            // directory before it was written, failing a Gradle validation check during publish
            // while ordinary builds passed. This covers consumers that resolve the source set as a
            // FileCollection: the source jar, dokka, lint. Kotlin compilation reads the srcDir
            // through AGP's variant wiring and is still declared separately, above.
            // (AGP's srcDir will not accept a task provider directly.)
            java.srcDir(files(libraryVersionSrcDir).builtBy(generateLibraryVersion))
            // AGP 9's built-in Kotlin compiles the kotlin source dirs, not java's.
            kotlin.srcDir(files(libraryVersionSrcDir).builtBy(generateLibraryVersion))
        }
    }
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // JaCoCo execution data from both test kinds, merged by jacocoMergedReport below.
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}

tasks.withType(Detekt).configureEach {
    config = files(["$projectDir/../detekt.yaml"])
}

tasks.withType(Test).configureEach {
    maxParallelForks = (Runtime.getRuntime().availableProcessors() / 2).toInteger() ?: 1
}

kover {
    reports {
        verify {
            rule {
                minBound(35)
            }
        }
        filters {
            excludes {
                classes("com.topsort.analytics.BuildConfig")
                // Worker tests are instrumented (androidTest), not JVM unit tests.
                // Kover gate only measures JVM test coverage, so exclude until
                // Robolectric unit tests are added.
                packages("com.topsort.analytics.worker")
            }
        }
    }
}

dokka {
    moduleName.set('Topsort Analytics')
    dokkaPublications.html {
        outputDirectory.set(layout.buildDirectory.dir('dokka/html'))
    }
    // Under AGP 9 Dokka registers one source set per variant over the same roots and refuses the
    // overlap; document release only.
    dokkaSourceSets.configureEach {
        suppress.set(it.name != 'release')
        skipEmptyPackages.set(true)
        documentedVisibilities.set([VisibilityModifier.Public] as Set)
        sourceLink {
            localDirectory.set(file("src/main/java"))
            remoteUrl("https://github.com/Topsort/topsort.kt/blob/main/TopsortAnalytics/src/main/java")
            remoteLineSuffix.set("#L")
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.annotation
    implementation libs.androidx.work.runtime
    implementation libs.androidx.security.crypto
    implementation libs.coil

    testImplementation libs.junit4
    testImplementation libs.org.json
    testImplementation libs.assertj.core
    testImplementation libs.mockk
    testImplementation libs.kotlinx.coroutines.test

    androidTestImplementation libs.assertj.core.android
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.work.testing
}

// One coverage number for the whole library: Kover sees only the JVM unit tests, so the event
// pipeline looked uncovered when its tests are instrumented. AGP writes JaCoCo execution data for
// both test kinds (debug only; the release AAR is untouched) and this merges them.
jacoco { toolVersion = '0.8.13' }

// The release unit-test task is instrumented by the jacoco plugin too, for nothing.
tasks.matching { it.name == 'testReleaseUnitTest' }.configureEach { jacoco.enabled = false }

def mergedExecutionData = fileTree(layout.buildDirectory) {
    include 'outputs/unit_test_code_coverage/debugUnitTest/*.exec'
    include 'outputs/code_coverage/debugAndroidTest/connected/**/*.ec'
}
// A variant's compiled classes, from the compile task's own outputs so the path is never named
// here and the task dependency comes for free.
// Resolved lazily: AGP registers the compile tasks after this script is evaluated.
def kotlinClasses = { String variant ->
    files({ tasks.getByName("compile${variant.capitalize()}Kotlin").outputs.files })
}

def mergedClassDirectories = kotlinClasses('debug').asFileTree.matching {
    exclude '**/LibraryVersion*'
}
def mergedSourceDirectories = files('src/main/java')

// Measured at 82% on 2026-08-28; gated a little below so a small drop is a conversation, not a
// red build. Both emulator legs run the gate, and API 24 may cover slightly less than 34.
def MERGED_COVERAGE_MINIMUM = 0.78

// JaCoCo does not fail on empty inputs - an empty class tree or no execution data is a 0-line
// report that passes any minimum - so both tasks refuse to run on nothing. Instrumented data is
// not produced here on purpose: run connectedCheck first, as CI does.
def requireCoverageInputs = {
    if (mergedClassDirectories.isEmpty()) throw new GradleException("no compiled debug classes to measure")
    if (mergedExecutionData.matching { include '**/*.ec' }.isEmpty()) throw new GradleException("no instrumented coverage; run connectedCheck first")
}

tasks.register('jacocoMergedReport', JacocoReport) {
    group = 'verification'
    dependsOn 'testDebugUnitTest'
    executionData.from(mergedExecutionData)
    classDirectories.from(mergedClassDirectories)
    sourceDirectories.from(mergedSourceDirectories)
    doFirst(requireCoverageInputs)
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('jacocoMergedVerification', JacocoCoverageVerification) {
    group = 'verification'
    dependsOn 'testDebugUnitTest'
    executionData.from(mergedExecutionData)
    classDirectories.from(mergedClassDirectories)
    sourceDirectories.from(mergedSourceDirectories)
    doFirst(requireCoverageInputs)
    violationRules {
        rule { limit { counter = 'LINE'; minimum = MERGED_COVERAGE_MINIMUM } }
    }
}

// binary-compatibility-validator registers its tasks only from the standalone Kotlin plugin's
// hook, which AGP 9's built-in Kotlin never applies (Kotlin/binary-compatibility-validator#312).
// Its task classes do not care, so they are registered here by hand: same dump file, same names.
dependencies {
    // The one piece the plugin adds only from that hook, at the Kotlin version AGP bundles.
    'bcv-rt-jvm-cp' "org.jetbrains.kotlin:kotlin-metadata-jvm:${org.jetbrains.kotlin.gradle.plugin.KotlinPluginWrapperKt.getKotlinPluginVersion(project)}"
}

def apiBuild = tasks.register('apiBuild', KotlinApiBuildTask) {
    description = 'Builds the public API dump from the release classes.'
    inputClassesDirs.from(kotlinClasses('release'))
    outputApiFile.set(layout.buildDirectory.file('api/TopsortAnalytics.api'))
    runtimeClasspath.from(configurations.named('bcv-rt-jvm-cp-resolver'))
}

tasks.register('apiCheck', KotlinApiCompareTask) {
    group = 'verification'
    mustRunAfter 'apiDump'
    description = 'Checks signatures of public API against the golden value in the api folder.'
    projectApiFile.set(layout.projectDirectory.file('api/TopsortAnalytics.api'))
    generatedApiFile.set(apiBuild.flatMap { it.outputApiFile })
}

// Not a Copy task: that would declare the api/ directory as an output while apiCheck reads a file
// in it, and Gradle rejects the undeclared ordering.
tasks.register('apiDump') {
    description = 'Syncs the API file after a deliberate public API change.'
    def from = apiBuild.flatMap { it.outputApiFile }
    def to = layout.projectDirectory.file('api/TopsortAnalytics.api')
    inputs.file(from)
    outputs.file(to)
    doLast { to.asFile.text = from.get().asFile.text }
}

tasks.named('check') { dependsOn 'apiCheck' }
